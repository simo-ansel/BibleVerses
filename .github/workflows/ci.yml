name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, format, tests
        run: npm run check
      - name: Expo Doctor
        run: npm run doctor
      - name: Bundle the Android app
        run: npx expo export --platform android --output-dir dist
